<div class="flex flex-col items-center gap-5 rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
  <div
    class="relative transition-opacity"
    [class.opacity-50]="disabled"
  >
    <ngx-chess-board
      #board
      [size]="480"
      [showCoords]="true"
      [drawDisabled]="false"
      [dragDisabled]="disabled"
      (moveChange)="onMoveChange($event)"
    ></ngx-chess-board>
    @if (disabled) {
      <div
        class="absolute inset-0 flex items-center justify-center rounded-lg bg-white/40"
        aria-live="polite"
      >
        <span
          class="h-8 w-8 animate-spin rounded-full border-4 border-slate-300 border-t-emerald-600"
        ></span>
      </div>
    }
  </div>

  <div class="flex flex-wrap justify-center gap-2">
    <button
      type="button"
      (click)="reset()"
      class="rounded-lg bg-slate-800 px-4 py-2 text-sm font-medium text-white transition hover:bg-slate-700 active:bg-slate-900"
    >
      Nouvelle partie
    </button>
    <button
      type="button"
      (click)="undo()"
      class="rounded-lg border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-700 transition hover:bg-slate-100"
    >
      Annuler le coup
    </button>
    <button
      type="button"
      (click)="flip()"
      class="rounded-lg border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-700 transition hover:bg-slate-100"
    >
      Retourner l'échiquier
    </button>
  </div>

  <form class="w-full max-w-[480px]" (ngSubmit)="loadFen()">
    <label for="fen-input" class="mb-1 block text-xs font-medium text-slate-500">
      Charger une position (FEN)
    </label>
    <div class="flex gap-2">
      <input
        id="fen-input"
        name="fen"
        type="text"
        [(ngModel)]="fenInput"
        placeholder="rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1"
        class="flex-1 rounded-lg border border-slate-300 px-3 py-2 font-mono text-xs text-slate-800 focus:border-emerald-500 focus:outline-none focus:ring-1 focus:ring-emerald-500"
      />
      <button
        type="submit"
        class="rounded-lg bg-emerald-600 px-4 py-2 text-sm font-medium text-white transition hover:bg-emerald-500"
      >
        Charger
      </button>
    </div>
    @if (loadError) {
      <p class="mt-1 text-xs text-red-600">{{ loadError }}</p>
    }
  </form>
</div>
